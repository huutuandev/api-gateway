spring:
  application:
    name: ai-gateway

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_gateway
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-this-in-production-must-be-at-least-32-chars}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000